# INTENTIONALLY LESS SECURE LAB CONFIGURATION. NEVER DEPLOY TO PRODUCTION.
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name baseline baseline.localhost localhost;

        ssl_certificate /certs/baseline.crt;
        ssl_certificate_key /certs/baseline.key;

        # Allows the modern TLS 1.3 and the older TLS 1.2.
        ssl_protocols TLSv1.2 TLSv1.3;
        # TLS 1.2 only: retain a CBC/SHA1 suite to illustrate weaker choices.
        ssl_ciphers 'ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;

        # Deliberately no Strict-Transport-Security header.
        location / {
            default_type text/plain;
            return 200 "TLS LAB - BASELINE (TLS 1.2/1.3; HSTS absent)\n";
        }
    }
}
