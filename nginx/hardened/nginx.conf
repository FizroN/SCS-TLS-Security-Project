# HARDENED CONFIGURATION FOR A LOCAL EDUCATIONAL LAB.
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name hardened hardened.localhost localhost;

        ssl_certificate /certs/hardened.crt;
        ssl_certificate_key /certs/hardened.key;

        ssl_protocols TLSv1.3;
        ssl_session_tickets off;

        # Short lifetime avoids leaving a long-lived HSTS rule in test browsers.
        # It is a demo header; production HSTS policy requires planning.
        add_header Strict-Transport-Security "max-age=300" always;

        location / {
            default_type text/plain;
            return 200 "TLS LAB - HARDENED (TLS 1.3 only; HSTS enabled)\n";
        }
    }
}
