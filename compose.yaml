name: tlslab

services:
  baseline:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/baseline/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    networks:
      - lab
    restart: unless-stopped

  hardened:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:9443:443"
    volumes:
      - ./nginx/hardened/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    networks:
      - lab
    restart: unless-stopped

  certgen:
    build: ./tools
    profiles: [setup]
    volumes:
      - ./certs:/certs
      - ./scripts/generate-certs.sh:/scripts/generate-certs.sh:ro
    entrypoint: ["/bin/sh", "/scripts/generate-certs.sh"]

  tls-client:
    build: ./tools
    profiles: [tools]
    volumes:
      - ./certs:/certs:ro
    networks:
      - lab
    entrypoint: ["openssl"]

networks:
  lab:
    name: tlslab_network
    driver: bridge
